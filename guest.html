<!doctype html>
<html lang="ko" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<!-- 손님 리모컨 (CR-228): 로그인 없음 · 저장 0 · 회사 허브 공개 broadcast만. 바깥 주소는 허브(*.supabase.co)뿐 -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src https://*.supabase.co wss://*.supabase.co; manifest-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#121316">
<title>노래방 리모컨</title>
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/guest.css">
</head>
<body>
<div class="app" id="app">
  <header class="ghd"><span class="t">노래방 리모컨</span><span class="conn off" id="conn"><i></i><span id="connTxt">붙는 중</span></span></header>

  <!-- 붙는 중 · QR 다시 · 닫힘(G6a) · 못 붙음(G6b) · 꽉 참 -->
  <section class="scr center" id="scrMsg">
    <span class="circle" id="msgIco" aria-hidden="true"></span>
    <div class="big" id="msgBig">방에 붙는 중…</div>
    <div class="body" id="msgBody">잠깐만 기다려 주세요</div>
    <div class="meta" id="msgMeta" hidden></div>
  </section>
  <div class="pad foot" id="msgFoot" hidden>
    <button class="btn pri" id="retryBtn" type="button"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 5v6h-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg><span>다시 해 보기</span></button>
    <div class="meta center-t" id="retryMeta">그래도 안 되면 TV의 QR을 다시 찍어 주세요</div>
  </div>

  <!-- G1 들어오기 -->
  <section class="scr" id="scrJoin" hidden>
    <div class="center grow">
      <span class="circle" aria-hidden="true"><svg viewBox="0 0 24 24" width="32" height="32"><path d="M9 18V5l12-2v13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="6" cy="18" r="3" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="18" cy="16" r="3" fill="none" stroke="currentColor" stroke-width="2"/></svg></span>
      <div class="big">노래방에 들어왔어요</div>
      <div class="body">로그인 없이 곡을 찾아 예약할 수 있어요</div>
    </div>
    <div class="pad">
      <label class="label lab" for="nick">이름 (안 써도 돼요)</label>
      <input class="field" id="nick" type="text" maxlength="8" placeholder="예: 손님1" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="go">
      <div class="meta hint-under">TV 예약 목록에 이 이름이 보여요 · 8자까지 · 방이 닫히면 지워져요</div>
    </div>
    <div class="pad join-btn"><button class="btn pri" id="joinBtn" type="button" disabled>방에 붙는 중…</button></div>
  </section>

  <!-- 들어온 뒤: 곡 찾기(G2·G3) · 지금 곡(G4) · 예약 목록(G5) -->
  <section class="scr main" id="scrMain" hidden>
    <div class="tab-body" id="tabFind" role="tabpanel" aria-label="곡 찾기">
      <div class="pad" id="segBox" hidden>
        <div class="seg" role="tablist">
          <button type="button" class="on" id="segMr" role="tab" aria-selected="true"><svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M9 18V5l12-2v13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="6" cy="18" r="3" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="18" cy="16" r="3" fill="none" stroke="currentColor" stroke-width="2"/></svg>내 MR</button>
          <button type="button" id="segYt" role="tab" aria-selected="false"><svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><rect x="2" y="5" width="20" height="14" rx="4" fill="none" stroke="currentColor" stroke-width="2"/><path d="M10 9.5v5l4.5-2.5z" fill="currentColor"/></svg>유튜브</button>
        </div>
      </div>
      <div class="pad find-top">
        <label class="field">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><path d="m20 20-4-4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          <input id="q" type="search" maxlength="60" placeholder="곡 이름 · 가수 · 번호" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="search" aria-label="곡 찾기">
          <button class="hit" id="qClear" type="button" aria-label="지우기" hidden><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
        </label>
        <div class="meta hint-under" id="findMeta"></div>
      </div>
      <div class="pad list" id="findList"></div>
    </div>

    <div class="tab-body" id="tabNow" role="tabpanel" aria-label="지금 곡" hidden>
      <div class="pad"><div class="card">
        <div class="label">지금 부르는 곡</div>
        <div class="now-t" id="nowTitle">지금 부르는 곡이 없어요</div>
        <div class="meta" id="nowSub">예약하면 TV에서 차례로 시작해요</div>
        <div id="nowProgBox" hidden>
          <div class="prog"><i id="nowProg"></i></div>
          <div class="meta times"><span id="nowAt">0:00</span><span id="nowDur">0:00</span></div>
        </div>
      </div></div>
      <div class="sech" id="keyHead">키</div>
      <div class="pad">
        <div class="keys">
          <button type="button" class="key" id="keyDown" disabled>♭<small>낮게</small></button>
          <button type="button" class="key key-0" id="keyZero" disabled>원래 키</button>
          <button type="button" class="key" id="keyUp" disabled>♯<small>높게</small></button>
        </div>
        <div class="info"><svg class="ic" viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 11v5M12 8v.01" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><span id="keyInfo">키는 지금 부르는 곡에만 바뀌어요. 유튜브 곡은 키를 못 바꿔요.</span></div>
      </div>
      <div class="sech">다음 곡</div>
      <div class="pad"><div class="rows" id="nextBox"></div></div>
    </div>

    <div class="tab-body" id="tabQueue" role="tabpanel" aria-label="예약 목록" hidden>
      <div class="pad q-head"><span class="q-n" id="qN">예약 0곡</span><span class="meta" id="qMine">내 예약 0곡</span></div>
      <div class="pad list" id="queueList"></div>
      <div class="pad"><div class="info"><svg class="ic" viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 11v5M12 8v.01" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><span>내가 넣은 곡만 뺄 수 있어요. 다른 사람 이름은 보이지 않아요.</span></div></div>
    </div>

    <nav class="tabs" role="tablist" aria-label="손님 리모컨">
      <button type="button" class="on" data-tab="tabFind" role="tab" aria-selected="true"><svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><path d="m20 20-4-4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><span>곡 찾기</span></button>
      <button type="button" data-tab="tabNow" role="tab" aria-selected="false"><svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M12 3a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V6a3 3 0 0 0-3-3zM19 11a7 7 0 0 1-14 0M12 18v3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg><span>지금 곡</span></button>
      <button type="button" data-tab="tabQueue" role="tab" aria-selected="false"><svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><span>예약 목록</span></button>
    </nav>
  </section>
</div>
<div class="toast" id="toast" role="status" hidden></div>

<!-- 순서: core.js가 손님 주소를 읽고, guest.js가 # 뒤를 바로 지운 뒤 supabase-js를 쓴다 -->
<script src="js/util.js"></script>
<script src="js/core.js"></script>
<script src="js/guest.js"></script>
<script src="js/vendor/supabase-2.117.1.js"></script>
</body>
</html>
